name: Build and deploy SIYAQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run content, progress, and security tests
        run: npm test
      - name: Build the static site
        run: npm run build
      - name: Configure GitHub Pages artifact
        uses: actions/configure-pages@v5
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the passing build
        id: deployment
        uses: actions/deploy-pages@v4
